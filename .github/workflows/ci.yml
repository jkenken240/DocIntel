name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel_ci
          POSTGRES_DB: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOCINTEL_ENVIRONMENT: test
      DOCINTEL_DATABASE_URL: postgresql+psycopg://docintel:docintel_ci@localhost:5432/docintel
      DOCINTEL_UPLOADS_PATH: /tmp/docintel/uploads
      DOCINTEL_PROCESSED_PATH: /tmp/docintel/processed
      DOCINTEL_SAMPLES_PATH: /tmp/docintel/samples
      DOCINTEL_BACKUPS_PATH: /tmp/docintel/backups
      DOCINTEL_AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.lock
            apps/api/requirements-dev.lock
      - name: Install frozen development dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Build wheel and source distribution
        run: python -m build --no-isolation --outdir dist
      - name: Install packaged application for checks
        run: python -m pip install --no-deps dist/*.whl
      - name: Smoke-test the built wheel with frozen runtime dependencies
        run: |
          python -m venv "$RUNNER_TEMP/docintel-runtime-smoke"
          "$RUNNER_TEMP/docintel-runtime-smoke/bin/python" -m pip install --require-hashes --no-deps -r requirements.lock
          "$RUNNER_TEMP/docintel-runtime-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/docintel-runtime-smoke/bin/python" -c "from docintel.main import app; assert app.title == 'DocIntel API'"
      - name: Audit locked runtime dependencies
        run: python -m pip_audit -r requirements.lock
      - name: Prepare test storage
        run: mkdir -p /tmp/docintel/{uploads,processed,samples,backups}
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src tests
      - name: Run unit tests
        run: python -m pytest tests/unit
      - name: Upgrade clean database through migration head
        run: alembic upgrade head
      - name: Verify migration revision and model drift
        run: |
          alembic current | grep 20260730_0004
          alembic check
      - name: Run PostgreSQL and pgvector integration tests
        env:
          DOCINTEL_RUN_INTEGRATION: "1"
        run: python -m pytest tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frozen frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run component tests
        run: npm run test
      - name: Build production frontend
        run: npm run build

  full-stack-browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DOCINTEL_BIND_ADDRESS: 127.0.0.1
      DOCINTEL_POSTGRES_USER: docintel
      DOCINTEL_POSTGRES_PASSWORD: docintel_ci_only
      DOCINTEL_POSTGRES_DB: docintel
      DOCINTEL_POSTGRES_PORT: "55432"
      DOCINTEL_API_PORT: "58000"
      DOCINTEL_WEB_PORT: "55173"
      DOCINTEL_CORS_ORIGINS: '["http://127.0.0.1:55173"]'
      DOCINTEL_AI_PROVIDER: mock
      DOCINTEL_API_IMAGE: docintel-api:ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOCINTEL_WEB_IMAGE: docintel-web:ci-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_API_BASE_URL: http://127.0.0.1:58000/api/v1
      DOCINTEL_E2E_WEB_URL: http://127.0.0.1:55173
      DOCINTEL_E2E_API_URL: http://127.0.0.1:58000/api/v1
      DOCINTEL_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Initialize isolated runtime paths
        id: initialize-ci-paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"

          compose_project="docintel-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_root="${RUNNER_TEMP}/docintel-phase7b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          diagnostics_root="${RUNNER_TEMP}/docintel-phase7b-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo "DOCINTEL_COMPOSE_PROJECT=${compose_project}"
            echo "DOCINTEL_DATA_ROOT=${data_root}"
            echo "DOCINTEL_DIAGNOSTICS_ROOT=${diagnostics_root}"
            echo "DOCINTEL_CI_PATHS_INITIALIZED=1"
          } >> "$GITHUB_ENV"
          echo "diagnostics_root=${diagnostics_root}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frozen browser-test dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated empty data root
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"
          test -n "${DOCINTEL_DATA_ROOT:-}"

          case "$DOCINTEL_DATA_ROOT" in
            /*) ;;
            *) echo "Refusing non-absolute CI data root." >&2; exit 1 ;;
          esac
          case "$DOCINTEL_DATA_ROOT" in
            *'*'*|*'?'*|*'['*|*']'*) echo "Refusing glob-containing CI data root." >&2; exit 1 ;;
          esac

          expected_data_root="${RUNNER_TEMP}/docintel-phase7b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$DOCINTEL_DATA_ROOT" = "$expected_data_root"
          if [ -L "$DOCINTEL_DATA_ROOT" ]; then
            echo "Refusing symlinked CI data root." >&2
            exit 1
          fi
          if [ -e "$DOCINTEL_DATA_ROOT" ] && [ ! -d "$DOCINTEL_DATA_ROOT" ]; then
            echo "Refusing non-directory CI data root." >&2
            exit 1
          fi

          configured_data_root=$(realpath -m -- "$DOCINTEL_DATA_ROOT")
          expected_data_root_canonical=$(realpath -m -- "$expected_data_root")
          runner_temp_canonical=$(realpath -e -- "$RUNNER_TEMP")
          test "$configured_data_root" = "$expected_data_root_canonical"
          test "$(dirname -- "$configured_data_root")" = "$runner_temp_canonical"

          mkdir -p -- "$DOCINTEL_DATA_ROOT"
          test -d "$DOCINTEL_DATA_ROOT"
          test ! -L "$DOCINTEL_DATA_ROOT"

          application_storage_paths=(
            "$DOCINTEL_DATA_ROOT/uploads"
            "$DOCINTEL_DATA_ROOT/processed"
            "$DOCINTEL_DATA_ROOT/samples"
            "$DOCINTEL_DATA_ROOT/backups"
          )
          for storage_path in "${application_storage_paths[@]}"; do
            if [ -L "$storage_path" ]; then
              echo "Refusing symlinked application-storage path: $storage_path" >&2
              exit 1
            fi
            if [ -e "$storage_path" ] && [ ! -d "$storage_path" ]; then
              echo "Refusing non-directory application-storage path: $storage_path" >&2
              exit 1
            fi
          done

          sudo install -d -o 10001 -g 10001 -m 0755 -- "${application_storage_paths[@]}"
          for storage_path in "${application_storage_paths[@]}"; do
            test -d "$storage_path"
            test ! -L "$storage_path"
            test "$(stat -c '%u:%g:%a' -- "$storage_path")" = "10001:10001:755"
          done
      - name: Validate production Compose configuration
        run: docker compose -p "$DOCINTEL_COMPOSE_PROJECT" config --quiet
      - name: Build production images
        run: docker compose -p "$DOCINTEL_COMPOSE_PROJECT" build
      - name: Start isolated production stack
        run: |
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" up -d --wait --wait-timeout 120 db
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" up -d --wait --wait-timeout 180 api worker web
      - name: Verify services, migration, and loopback publishing
        run: |
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose -p "$DOCINTEL_COMPOSE_PROJECT" ps -a -q migrate)")" = "0"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" exec -T db pg_isready -U "$DOCINTEL_POSTGRES_USER" -d "$DOCINTEL_POSTGRES_DB"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" exec -T db psql -U "$DOCINTEL_POSTGRES_USER" -d "$DOCINTEL_POSTGRES_DB" -Atc "SELECT extversion FROM pg_extension WHERE extname = 'vector';" | grep -E '^[0-9]'
          curl --fail --silent "http://127.0.0.1:${DOCINTEL_API_PORT}/api/v1/health/ready" | python -c "import json,sys; data=json.load(sys.stdin); assert data['status']=='ready'; required={'database','pgvector','migration','storage','provider'}; assert required <= data['checks'].keys(); assert all(data['checks'][key]['status']=='ready' for key in required)"
          curl --fail --silent "http://127.0.0.1:${DOCINTEL_WEB_PORT}/healthz" | grep ok
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" exec -T api alembic current | grep 20260730_0004
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" port db 5432 | grep "^127.0.0.1:"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" port api 8000 | grep "^127.0.0.1:"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" port web 8080 | grep "^127.0.0.1:"
      - name: Run production full-stack browser and accessibility tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Capture failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "$DOCINTEL_DIAGNOSTICS_ROOT"
          diagnostics_mkdir_status=$?
          if [ "$diagnostics_mkdir_status" -ne 0 ]; then
            echo "Unable to create the initialized diagnostics directory." >&2
            exit 0
          fi

          command_status="$DOCINTEL_DIAGNOSTICS_ROOT/diagnostic-command-status.txt"
          : > "$command_status"
          record_status() {
            printf '%s=%s\n' "$1" "$2" >> "$command_status"
          }
          record_status diagnostics_mkdir "$diagnostics_mkdir_status"

          readiness_url="http://127.0.0.1:${DOCINTEL_API_PORT}/api/v1/health/ready"
          readiness_headers="$DOCINTEL_DIAGNOSTICS_ROOT/readiness-headers.tmp"
          readiness_body="$DOCINTEL_DIAGNOSTICS_ROOT/readiness-body.json"
          readiness_status="$DOCINTEL_DIAGNOSTICS_ROOT/readiness-status.txt"
          readiness_content_type="$DOCINTEL_DIAGNOSTICS_ROOT/readiness-content-type.txt"
          readiness_curl_error="$DOCINTEL_DIAGNOSTICS_ROOT/readiness-curl-error.txt"

          curl --silent --show-error --connect-timeout 3 --max-time 10 \
            --output "$readiness_body" \
            --dump-header "$readiness_headers" \
            --write-out '%{http_code}' \
            "$readiness_url" > "$readiness_status" 2> "$readiness_curl_error"
          host_readiness_status=$?
          record_status host_readiness_curl "$host_readiness_status"
          if [ ! -s "$readiness_status" ]; then
            printf 'unavailable\n' > "$readiness_status"
          fi
          awk 'BEGIN { IGNORECASE=1 } /^Content-Type:/ { value=$0; sub(/^[^:]*:[[:space:]]*/, "", value); sub(/\r$/, "", value); print value }' \
            "$readiness_headers" | tail -n 1 > "$readiness_content_type"
          host_content_type_status=$?
          record_status host_readiness_content_type "$host_content_type_status"
          if [ ! -s "$readiness_content_type" ]; then
            printf 'unavailable\n' > "$readiness_content_type"
          fi
          rm -f -- "$readiness_headers"
          record_status host_readiness_header_cleanup "$?"

          internal_envelope="$DOCINTEL_DIAGNOSTICS_ROOT/internal-readiness-envelope.json"
          internal_error="$DOCINTEL_DIAGNOSTICS_ROOT/internal-readiness-command-error.txt"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" exec -T api python - \
            > "$internal_envelope" 2> "$internal_error" <<'PY'
          import base64
          import json
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/v1/health/ready"
          limit = 65_536
          try:
              try:
                  response = urllib.request.urlopen(url, timeout=5)
              except urllib.error.HTTPError as exc:
                  response = exc
              body = response.read(limit + 1)
              result = {
                  "connection": "ok",
                  "status": response.getcode(),
                  "content_type": response.headers.get("Content-Type") or "unavailable",
                  "body_base64": base64.b64encode(body[:limit]).decode("ascii"),
                  "truncated": len(body) > limit,
                  "error_type": None,
              }
          except Exception as exc:
              allowed = {"ConnectionRefusedError", "OSError", "TimeoutError", "URLError"}
              error_type = type(exc).__name__
              result = {
                  "connection": "failed",
                  "status": None,
                  "content_type": "unavailable",
                  "body_base64": "",
                  "truncated": False,
                  "error_type": error_type if error_type in allowed else "OtherError",
              }
          print(json.dumps(result, separators=(",", ":")))
          PY
          internal_probe_status=$?
          record_status internal_readiness_probe "$internal_probe_status"

          python - "$internal_envelope" "$DOCINTEL_DIAGNOSTICS_ROOT" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          envelope_path = pathlib.Path(sys.argv[1])
          output_root = pathlib.Path(sys.argv[2])
          try:
              payload = json.loads(envelope_path.read_text(encoding="utf-8"))
              body = base64.b64decode(payload.get("body_base64", ""), validate=True)
              (output_root / "internal-readiness-body.txt").write_bytes(body)
              (output_root / "internal-readiness-status.txt").write_text(
                  f"{payload.get('status') if payload.get('status') is not None else 'unavailable'}\n",
                  encoding="utf-8",
              )
              (output_root / "internal-readiness-content-type.txt").write_text(
                  f"{payload.get('content_type') or 'unavailable'}\n",
                  encoding="utf-8",
              )
              (output_root / "internal-readiness-connection.txt").write_text(
                  f"connection={payload.get('connection', 'unavailable')}\n"
                  f"error_type={payload.get('error_type') or 'none'}\n"
                  f"truncated={str(bool(payload.get('truncated'))).lower()}\n",
                  encoding="utf-8",
              )
          except (OSError, ValueError, TypeError, json.JSONDecodeError):
              (output_root / "internal-readiness-body.txt").write_bytes(b"")
              (output_root / "internal-readiness-status.txt").write_text("unavailable\n", encoding="utf-8")
              (output_root / "internal-readiness-content-type.txt").write_text("unavailable\n", encoding="utf-8")
              (output_root / "internal-readiness-connection.txt").write_text(
                  "connection=unavailable\nerror_type=DiagnosticParseError\ntruncated=false\n",
                  encoding="utf-8",
              )
              raise SystemExit(1)
          PY
          internal_parse_status=$?
          record_status internal_readiness_parse "$internal_parse_status"

          python - \
            "$readiness_body" \
            "$DOCINTEL_DIAGNOSTICS_ROOT/internal-readiness-body.txt" \
            "$DOCINTEL_DIAGNOSTICS_ROOT/readiness-components.txt" <<'PY'
          import json
          import pathlib
          import re
          import sys

          expected = ("database", "pgvector", "migration", "storage", "provider")
          sources = (("host", pathlib.Path(sys.argv[1])), ("container", pathlib.Path(sys.argv[2])))
          output_path = pathlib.Path(sys.argv[3])
          parsed = None
          source_name = "none"
          for candidate_name, candidate_path in sources:
              try:
                  candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  continue
              if isinstance(candidate, dict):
                  parsed = candidate
                  source_name = candidate_name
                  break

          lines = [f"source={source_name}"]
          if parsed is None:
              lines.append("parse_status=unparseable_or_missing")
              lines.extend(f"component.{name}=omitted" for name in expected)
          else:
              lines.append("parse_status=parsed")
              overall = parsed.get("status", "omitted")
              lines.append(f"overall_status={str(overall)[:80]}")
              checks = parsed.get("checks")
              if not isinstance(checks, dict):
                  lines.append("checks=omitted_or_invalid")
                  lines.extend(f"component.{name}=omitted" for name in expected)
              else:
                  names = list(expected) + sorted(str(name) for name in checks if str(name) not in expected)
                  for name in names:
                      safe_name = re.sub(r"[^A-Za-z0-9_-]", "_", name)[:80]
                      value = checks.get(name)
                      if not isinstance(value, dict):
                          lines.append(f"component.{safe_name}=omitted_or_invalid")
                          continue
                      status = str(value.get("status", "omitted")).replace("\n", " ")[:80]
                      detail = str(value.get("detail", "omitted")).replace("\n", " ")[:240]
                      lines.append(f"component.{safe_name}.status={status}")
                      lines.append(f"component.{safe_name}.detail={detail}")
          output_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          component_parse_status=$?
          record_status readiness_component_parse "$component_parse_status"

          api_container_id=$(docker compose -p "$DOCINTEL_COMPOSE_PROJECT" ps -a -q api 2> "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-id-error.txt")
          api_container_id_status=$?
          printf '%s\n' "${api_container_id:-unavailable}" > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-id.txt"
          record_status api_container_id "$api_container_id_status"
          if [ -n "$api_container_id" ]; then
            docker inspect --format 'state={{.State.Status}}{{println}}exit_code={{.State.ExitCode}}{{println}}configured_user={{if .Config.User}}{{.Config.User}}{{else}}default{{end}}' \
              "$api_container_id" > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-state.txt" \
              2> "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-state-error.txt"
            record_status api_container_state "$?"
            docker inspect --format '{{json .State.Health}}' "$api_container_id" \
              > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-health.json" \
              2> "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-health-error.txt"
            record_status api_container_health "$?"
            docker inspect --format '{{range .Mounts}}type={{.Type}} destination={{.Destination}}{{println}}{{end}}' \
              "$api_container_id" > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-mounts.txt" \
              2> "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-mounts-error.txt"
            record_status api_container_mounts "$?"
          else
            printf 'unavailable\n' > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-state.txt"
            printf 'null\n' > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-health.json"
            printf 'unavailable\n' > "$DOCINTEL_DIAGNOSTICS_ROOT/api-container-mounts.txt"
            record_status api_container_state 125
            record_status api_container_health 125
            record_status api_container_mounts 125
          fi

          host_storage="$DOCINTEL_DIAGNOSTICS_ROOT/host-application-storage.txt"
          : > "$host_storage"
          printf 'runner_uid=%s\nrunner_gid=%s\n' "$(id -u)" "$(id -g)" >> "$host_storage"
          for storage_name in root uploads processed samples backups; do
            if [ "$storage_name" = "root" ]; then
              storage_path="$DOCINTEL_DATA_ROOT"
            else
              storage_path="$DOCINTEL_DATA_ROOT/$storage_name"
            fi
            printf 'name=%s\npath=%s\n' "$storage_name" "$storage_path" >> "$host_storage"
            if [ -L "$storage_path" ]; then
              printf 'symlink=yes\n' >> "$host_storage"
            else
              printf 'symlink=no\n' >> "$host_storage"
            fi
            if [ -e "$storage_path" ]; then
              printf 'exists=yes\n' >> "$host_storage"
              stat -c 'type=%F uid=%u gid=%g mode=%a' -- "$storage_path" >> "$host_storage" 2>&1
              host_stat_status=$?
            else
              printf 'exists=no\n' >> "$host_storage"
              host_stat_status=2
            fi
            record_status "host_storage_${storage_name}_stat" "$host_stat_status"
          done

          for service_name in api worker; do
            docker compose -p "$DOCINTEL_COMPOSE_PROJECT" exec -T "$service_name" sh -s \
              > "$DOCINTEL_DIAGNOSTICS_ROOT/${service_name}-application-storage.txt" \
              2> "$DOCINTEL_DIAGNOSTICS_ROOT/${service_name}-application-storage-error.txt" <<'SH'
          printf 'effective_uid=%s\neffective_gid=%s\n' "$(id -u)" "$(id -g)"
          for storage_path in /data/uploads /data/processed /data/samples /data/backups; do
            printf 'path=%s\n' "$storage_path"
            if [ -L "$storage_path" ]; then printf 'symlink=yes\n'; else printf 'symlink=no\n'; fi
            if [ -e "$storage_path" ]; then
              printf 'exists=yes\n'
              stat -c 'type=%F uid=%u gid=%g mode=%a' -- "$storage_path"
              printf 'stat_exit_status=%s\n' "$?"
            else
              printf 'exists=no\n'
              printf 'stat_exit_status=2\n'
            fi
            if [ -r "$storage_path" ]; then printf 'readable=yes\n'; else printf 'readable=no\n'; fi
            if [ -w "$storage_path" ]; then printf 'writable=yes\n'; else printf 'writable=no\n'; fi
            if [ -x "$storage_path" ]; then printf 'traversable=yes\n'; else printf 'traversable=no\n'; fi
          done
          SH
            record_status "${service_name}_application_storage" "$?"
          done

          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" logs --no-color --tail 200 api \
            > "$DOCINTEL_DIAGNOSTICS_ROOT/api-logs-tail.txt" 2>&1
          record_status api_logs_tail "$?"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" ps --all \
            > "$DOCINTEL_DIAGNOSTICS_ROOT/compose-ps.txt" 2>&1
          record_status compose_ps "$?"
          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" ps --all --format json \
            > "$DOCINTEL_DIAGNOSTICS_ROOT/compose-ps.json" 2> "$DOCINTEL_DIAGNOSTICS_ROOT/compose-ps-json-error.txt"
          record_status compose_ps_json "$?"

          compose_service_state="$DOCINTEL_DIAGNOSTICS_ROOT/compose-service-state.txt"
          : > "$compose_service_state"
          for service_name in db migrate api worker web; do
            service_container_id=$(docker compose -p "$DOCINTEL_COMPOSE_PROJECT" ps -a -q "$service_name" 2>> "$DOCINTEL_DIAGNOSTICS_ROOT/compose-service-state-error.txt")
            service_id_status=$?
            record_status "compose_${service_name}_container_id" "$service_id_status"
            if [ -n "$service_container_id" ]; then
              printf 'service=%s ' "$service_name" >> "$compose_service_state"
              docker inspect --format 'state={{.State.Status}} exit_code={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}}' \
                "$service_container_id" >> "$compose_service_state" \
                2>> "$DOCINTEL_DIAGNOSTICS_ROOT/compose-service-state-error.txt"
              record_status "compose_${service_name}_state" "$?"
            else
              printf 'service=%s unavailable\n' "$service_name" >> "$compose_service_state"
              record_status "compose_${service_name}_state" 125
            fi
          done

          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" logs --no-color --tail 300 \
            > "$DOCINTEL_DIAGNOSTICS_ROOT/compose.log" 2>&1
          record_status compose_logs_tail "$?"
          exit 0
      - name: Upload failure-only browser and Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase7b-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results
            ${{ steps.initialize-ci-paths.outputs.diagnostics_root }}
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down only the isolated CI stack and data root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DOCINTEL_CI_PATHS_INITIALIZED:-}" != "1" ]; then
            echo "Runtime paths were not initialized; no isolated resources exist to remove."
            exit 0
          fi
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"
          test -n "${GITHUB_WORKSPACE:-}"
          test -n "${DOCINTEL_COMPOSE_PROJECT:-}"
          test -n "${DOCINTEL_DATA_ROOT:-}"

          expected_project="docintel-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expected_data_root="${RUNNER_TEMP}/docintel-phase7b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$DOCINTEL_COMPOSE_PROJECT" = "$expected_project"
          test "$DOCINTEL_DATA_ROOT" = "$expected_data_root"

          case "$DOCINTEL_DATA_ROOT" in
            /*) ;;
            *) echo "Refusing non-absolute CI data root." >&2; exit 1 ;;
          esac
          case "$DOCINTEL_DATA_ROOT" in
            *'*'*|*'?'*|*'['*|*']'*) echo "Refusing glob-containing CI data root." >&2; exit 1 ;;
          esac
          if [ -L "$DOCINTEL_DATA_ROOT" ]; then
            echo "Refusing symlinked CI data root." >&2
            exit 1
          fi

          configured_data_root=$(realpath -m -- "$DOCINTEL_DATA_ROOT")
          expected_data_root_canonical=$(realpath -m -- "$expected_data_root")
          runner_temp_canonical=$(realpath -e -- "$RUNNER_TEMP")
          workspace_canonical=$(realpath -m -- "$GITHUB_WORKSPACE")
          test "$configured_data_root" = "$expected_data_root_canonical"
          test "$(dirname -- "$configured_data_root")" = "$runner_temp_canonical"
          test "$configured_data_root" != "/"
          test "$configured_data_root" != "$runner_temp_canonical"
          case "$configured_data_root" in
            "$workspace_canonical"|"$workspace_canonical"/*)
              echo "Refusing repository path as CI data root." >&2
              exit 1
              ;;
          esac

          docker compose -p "$DOCINTEL_COMPOSE_PROJECT" down --remove-orphans

          remaining_containers=$(docker ps -aq --filter "label=com.docker.compose.project=$DOCINTEL_COMPOSE_PROJECT")
          if [ -n "$remaining_containers" ]; then
            echo "Refusing data removal while project containers remain." >&2
            exit 1
          fi
          remaining_networks=$(docker network ls -q --filter "label=com.docker.compose.project=$DOCINTEL_COMPOSE_PROJECT")
          if [ -n "$remaining_networks" ]; then
            echo "Refusing data removal while project networks remain." >&2
            exit 1
          fi

          if [ -e "$DOCINTEL_DATA_ROOT" ]; then
            test -d "$DOCINTEL_DATA_ROOT"
            test ! -L "$DOCINTEL_DATA_ROOT"
            sudo find "$DOCINTEL_DATA_ROOT" -xdev -depth -mindepth 1 -delete
            sudo rmdir -- "$DOCINTEL_DATA_ROOT"
          fi
          test ! -e "$DOCINTEL_DATA_ROOT"
          test ! -L "$DOCINTEL_DATA_ROOT"
