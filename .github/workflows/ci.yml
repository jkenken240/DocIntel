name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel_ci
          POSTGRES_DB: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOCINTEL_ENVIRONMENT: test
      DOCINTEL_DATABASE_URL: postgresql+psycopg://docintel:docintel_ci@localhost:5432/docintel
      DOCINTEL_UPLOADS_PATH: /tmp/docintel/uploads
      DOCINTEL_PROCESSED_PATH: /tmp/docintel/processed
      DOCINTEL_SAMPLES_PATH: /tmp/docintel/samples
      DOCINTEL_BACKUPS_PATH: /tmp/docintel/backups
      DOCINTEL_AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare test storage
        run: mkdir -p /tmp/docintel/{uploads,processed,samples,backups}
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src tests
      - name: Run unit tests
        run: python -m pytest tests/unit
      - name: Upgrade clean database
        run: alembic upgrade head
      - name: Run platform integration test
        env:
          DOCINTEL_RUN_INTEGRATION: "1"
        run: python -m pytest tests/integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run component tests
        run: npm run test
      - name: Build
        run: npm run build
